<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทดสอบออนไลน์ - วิทยาลัยเทคนิคสัตหีบ</title>
    <!-- นำเข้า Tailwind CSS สำหรับการจัดการความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ป้องกันการคลุมดำข้อความบนหน้าเว็บหลัก */
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col" oncontextmenu="return false;">

    <!-- ส่วนหัวของหน้าเว็บ -->
    <header class="bg-blue-800 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">ระบบทดสอบออนไลน์</h1>
        <p class="text-sm mt-1">กรุณาทำแบบทดสอบด้วยความซื่อสัตย์ ระบบจะบันทึกการสลับหน้าจอของท่าน</p>
    </header>

    <!-- หน้าต่างแจ้งเตือน (Modal) เมื่อตรวจพบการสลับหน้าจอ -->
    <div id="warningModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl text-center max-w-sm mx-4">
            <h2 class="text-xl font-bold text-red-600 mb-2">แจ้งเตือนการทำผิดเงื่อนไข</h2>
            <p class="text-gray-700 mb-4">ตรวจพบการสลับหน้าจอ หรือพับแอปพลิเคชัน ระบบได้ทำการบันทึกพฤติกรรมนี้ไว้แล้ว</p>
            <p id="violationCount" class="font-bold text-lg mb-4 text-gray-800">จำนวนครั้งที่ละเมิด: 0</p>
            <button onclick="closeModal()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">
                รับทราบและกลับสู่การสอบ
            </button>
        </div>
    </div>

    <!-- พื้นที่สำหรับฝัง Google Forms -->
    <main class="flex-grow container mx-auto px-2 py-6 w-full max-w-4xl">
        <div class="bg-white rounded-lg shadow-md overflow-hidden" style="height: 85vh;">
            
            <!-- นำรหัส iframe จาก Google Forms มาวางทับบรรทัดนี้ -->
			<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdtiEP3mNm4aXOmzIrI8PzmXWve3dAUlA5TenN15GaUeQKHrQ/viewform?embedded=true" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0">กำลังโหลด…</iframe>
            <!-- สิ้นสุดพื้นที่ iframe -->

        </div>
    </main>

    <!-- ระบบตรวจจับการสลับหน้าจอ (JavaScript) -->
    <script>
        let warningCount = 0;
        const modal = document.getElementById('warningModal');
        const countDisplay = document.getElementById('violationCount');

        // ฟังก์ชันตรวจสอบเมื่อหน้าเว็บถูกซ่อนหรือเปลี่ยนแท็บ
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                warningCount++;
                countDisplay.textContent = `จำนวนครั้งที่ละเมิด: ${warningCount}`;
                modal.classList.remove('hidden');
            }
        });

        // ฟังก์ชันปิดหน้าต่างแจ้งเตือน
        function closeModal() {
            modal.classList.add('hidden');
        }
    </script>
</body>
</html>
