<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบศูนย์กลางการทดสอบ - วิทยาลัยเทคนิคสัตหีบ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-xl max-w-lg w-full text-center mx-4">
        <h1 class="text-2xl font-bold text-blue-800 mb-2">ระบบศูนย์กลางการทดสอบ</h1>
        <p class="text-gray-600 mb-8">กรุณาเลือกรายวิชาที่ต้องการทดสอบ</p>

        <div class="space-y-4">
            <!-- ปุ่มวิชาที่ 1 -->
            <button onclick="checkPassword('plc20105')" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 transition">
                1. สอบวิชา โปรแกรมเมเบิลลอจิกคอนโทรลเลอร์ ปวช
            </button>
            
            <!-- ปุ่มวิชาที่ 2 -->
            <button onclick="checkPassword('electronics')" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 transition">
                2. สอบวิชา อิเล็กทรอนิกส์อุตสาหกรรม
            </button>

            <!-- ปุ่มวิชาที่ 3 -->
            <button onclick="checkPassword('micro')" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 transition">
                3. สอบวิชา ไมโครคอนโทรลเลอร์
            </button>

            <!-- ปุ่มวิชาที่ 4 -->
            <button onclick="checkPassword('instrument')" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded hover:bg-blue-700 transition">
                4. สอบวิชา เครื่องมือวัด
            </button>
        </div>
        
        <p class="text-sm text-red-600 mt-8 font-bold">
            คำเตือน: ระบบจะมีการบันทึกพฤติกรรมการสลับหน้าจอของท่านในทุกรายวิชา
        </p>
    </div>

    <!-- ชุดคำสั่ง JavaScript สำหรับตรวจสอบรหัสผ่าน -->
    <script>
        // ฐานข้อมูลรหัสผ่านและหน้าเว็บปลายทางของแต่ละรายวิชา
        const examData = {
            'plc': {
                password: "123", // เปลี่ยนรหัสผ่านวิชา PLC ที่นี่
                url: "plc20105.html"
            },
            'electronics': {
                password: "456", // เปลี่ยนรหัสผ่านวิชาอิเล็กทรอนิกส์ฯ ที่นี่
                url: "exam-electronics.html"
            },
            'micro': {
                password: "789", // เปลี่ยนรหัสผ่านวิชาไมโครฯ ที่นี่
                url: "exam-micro.html"
            },
            'instrument': {
                password: "abc", // เปลี่ยนรหัสผ่านวิชาเครื่องมือวัด ที่นี่
                url: "exam-instrument.html"
            }
        };

        function checkPassword(subjectKey) {
            // ดึงข้อมูลรายวิชาจากฐานข้อมูล
            const exam = examData[subjectKey];
            
            // แสดงกล่องโต้ตอบให้ผู้เข้าสอบกรอกรหัสผ่าน
            const userInput = prompt("กรุณากรอกรหัสผ่านเพื่อเข้าสู่แบบทดสอบ:");
            
            // ตรวจสอบเงื่อนไข
            if (userInput === null) {
                // กรณีผู้ใช้กดปุ่ม ยกเลิก (Cancel)
                return; 
            } else if (userInput === exam.password) {
                // กรณีรหัสผ่านถูกต้อง ให้เปลี่ยนไปยังหน้าข้อสอบ
                window.location.href = exam.url;
            } else {
                // กรณีรหัสผ่านไม่ถูกต้อง
                alert("รหัสผ่านไม่ถูกต้อง กรุณาติดต่อผู้คุมสอบ");
            }
        }
    </script>
</body>
</html>
